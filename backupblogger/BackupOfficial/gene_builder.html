<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de sección de genes</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; background:#f4f4f4; }
    label { display:block; margin:0.5rem 0 0.2rem; }
    input[type=text] { width:100%; padding:0.5rem; }
    textarea { width:100%; height:15rem; margin-top:1rem; }
    .preview { background:#fff; padding:1rem; border:1px solid #ccc; margin-top:1rem; }
    .gene-section img { width:50px; vertical-align:middle; margin-right:6px; }
  </style>
</head>
<body>
  <h1>Constructor de código de genes</h1>
  <p>Rellena los campos y copia el resultado desde el cuadro inferior.</p>
  <label for="gene1Url">URL imagen gen ataque 1</label>
  <input type="text" id="gene1Url" placeholder="https://.../gene_necro.png">


  <label for="gene2Url">URL imagen gen ataque 2</label>
  <input type="text" id="gene2Url" placeholder="https://.../gene_neutro_multiple.png">

  <label for="bingoValue">Valor de Bingo</label>
  <input type="text" id="bingoValue" placeholder="Research XIII">

  <button id="generateBtn">Generar código completo</button>

  <div class="preview" id="previewArea"></div>
  <textarea id="resultArea" readonly></textarea>

  <script>
    async function update() {
      const g1 = document.getElementById('gene1Url').value;
      const g2 = document.getElementById('gene2Url').value;
      const bingo = document.getElementById('bingoValue').value || 'Research XIII';
      
      // build replacement snippets
      const geneSection = `<!--GENES EN DOS COLUMNAS-->
<!--GEN SABER--><!--GEN CIBERNÉTICO-->
  <table class="stats-table">
  <tbody><tr>
    
    <td style="vertical-align: top; width: 50%;">
      <div class="gene-section">
        <h4>
          <img src="${g1}" />
          (Attack1p_name)
        </h4>
        <ul>
          <li><strong>Attack:</strong> (atk1)</li>
          <li><strong>Upgrade:</strong> (atk1p)</li>
        </ul>
        <div class="ability-row">
          <img src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/icons/(abilities).png" />
          <span><strong>Ability:</strong> (abilityPct1)</span>
        </div>
        <div class="ability-row">
          <img src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/icons/(abilities).png" />
          <span><strong>Upgrade:</strong> (abilityPct2)</span>
        </div>
      </div>
    </td>

    
    <td style="vertical-align: top; width: 50%;">
      <div class="gene-section">
        <h4>
          <img src="${g2}" />
          (Attack2p_name)
        </h4>
        <ul>
          <li><strong>Attack:</strong> (atk2)</li>
          <li><strong>Upgrade:</strong> (atk2p)</li>
        </ul>
        <div class="ability-row">
          <img src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/icons/(abilities).png" />
          <span><strong>Ability:</strong> (abilityPct1)</span>
        </div>
        <div class="ability-row">
          <img src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/icons/(abilities).png" />
          <span><strong>Upgrade:</strong> (abilityPct2)</span>
        </div>
      </div>
    </td>
  </tr>
</tbody></table>`;
      const bingoSnippet = `<span>Bingo: ${bingo}</span>`;

      // fetch original post.html
      let html = '';
      try {
        const res = await fetch('post.html');
        html = await res.text();
      } catch (err) {
        html = '<!-- error loading post.html -->';
      }
      // replace gene section
      html = html.replace(/<!--GENES EN DOS COLUMNAS-->[\s\S]*?<\/table>/, geneSection);
      // replace all bingo spans
      html = html.replace(/<span>Bingo:[^<]*<\/span>/g, bingoSnippet);
      // update bingo value inside table row as well
      html = html.replace(/(<td><strong>Bingo:<\/strong><\/td>\s*<td>)[^<]*(<\/td>)/, `$1${bingo}$2`);

      document.getElementById('previewArea').innerHTML = '<pre style="white-space:pre-wrap;">'+html.replace(/</g, '&lt;')+'</pre>';
      document.getElementById('resultArea').value = html;
    }
    document.getElementById('generateBtn').addEventListener('click', update);
  </script>
</body>
</html>
