<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Mutantes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
            grid-column: 1 / -1;
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background-color: #f8f9ff;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .row.three {
            grid-template-columns: 1fr 1fr 1fr;
        }
        
        .attack-section {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .attack-section h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button.copy-btn {
            background: #4caf50;
            margin-top: 20px;
        }
        
        button.copy-btn:hover {
            background: #45a049;
        }
        
        .preview {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 5px;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #ddd;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #333;
        }
        
        .copy-feedback {
            background: #4caf50;
            color: white;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .add-attack-btn {
            background: #667eea;
            margin-top: 10px;
        }
        
        .remove-attack-btn {
            background: #ff6b6b;
            padding: 8px 12px;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .remove-attack-btn:hover {
            background: #ff5252;
        }
        
        .attacks-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>🦹 Editor de Mutantes</h1>
    
    <div class="container">
        <!-- PANEL DE EDICIÓN -->
        <div class="panel">
            <h2>📝 Datos del Mutante</h2>
            
            <div class="form-group">
                <label for="nombre">Nombre del Mutante</label>
                <input type="text" id="nombre" value="Spectroplasm" placeholder="Ingresa el nombre">
            </div>
            
            <div class="form-group">
                <label for="descripcion">Descripción / Historia</label>
                <textarea id="descripcion" placeholder="Ingresa la descripción">This ectoplasmic entity is particularly unstable. Created as simple cells during the study of ectoplasmic fluids, it continued to evolve until it reached full consciousness. Capable of possessing other mutants and generating powerful ectoplasmic explosions, the entity has been confined to use in arenas to avoid further major problems related to the possession of mutants.</textarea>
            </div>
            
            <h2 style="margin-top: 25px;">🖼️ URLs de Imágenes</h2>
            
            <div class="form-group">
                <label for="imagenMutante">URL Imagen Mutante</label>
                <input type="text" id="imagenMutante" value="https://s-ak.kobojo.com/mutants/assets/thumbnails/specimen_b_14.png">
            </div>
            
            <div class="form-group">
                <label for="imagenLarva">URL Imagen Larva</label>
                <input type="text" id="imagenLarva" value="https://s-ak.kobojo.com/mutants/assets/larvas/larva_b_13.png">
            </div>
            
            <div class="form-group">
                <label for="imagenTipo">URL Imagen Tipo (Rarity)</label>
                <input type="text" id="imagenTipo" value="https://s-ak.kobojo.com/mutants/assets/mobile/hud/m_m_m/icon_legendary.png">
            </div>

            <h2 style="margin-top: 25px;">🧬 Genes Row (Encabezado)</h2>
            
            <div class="form-group">
                <label for="geneImg1">URL Gene 1</label>
                <input type="text" id="geneImg1" value="https://s-ak.kobojo.com/mutants/assets/mobile/hud/fight_ui/gene_b.png">
            </div>
            
            <div class="form-group">
                <label for="geneImg2">URL Gene 2</label>
                <input type="text" id="geneImg2" value="https://s-ak.kobojo.com/mutants/assets/mobile/hud/fight_ui/gene_all.png">
            </div>
            
            <h2 style="margin-top: 25px;">⚙️ Estadísticas Básicas</h2>
            
            <div class="row">
                <div class="form-group">
                    <label for="vida">Vida (HP)</label>
                    <input type="number" id="vida" value="1951">
                </div>
                <div class="form-group">
                    <label for="velocidad">Velocidad</label>
                    <input type="number" id="velocidad" value="5.41" step="0.01">
                </div>
            </div>
            
            <div class="form-group">
                <label for="bingo">Bingo / Investigación</label>
                <input type="text" id="bingo" value="Research XIII">
            </div>
            
            <div class="form-group">
                <label for="habilidad">Habilidad Principal</label>
                <input type="text" id="habilidad" value="Weaken">
            </div>
            
            <div class="form-group">
                <label for="coins">Monedas por Hora</label>
                <input type="number" id="coins" value="42">
            </div>
            
            <h2 style="margin-top: 25px;">🧬 Genes / Ataques</h2>
            
            <div class="attacks-container" id="attacksContainer">
                <!-- Los ataques se generan dinámicamente -->
            </div>
            
            <button class="add-attack-btn" onclick="agregarAtaque()">+ Agregar Ataque</button>
            
            <button onclick="generarCodigo()" style="margin-top: 20px; background: #764ba2;">Generar Código</button>
        </div>
        
        <!-- PANEL DE VISTA PREVIA -->
        <div class="panel">
            <h2>📋 Vista Previa del Código HTML</h2>
            
            <div class="copy-feedback" id="copyFeedback">
                ✓ ¡Código copiado al portapapeles!
            </div>
            
            <button class="copy-btn" onclick="copiarCodigo()">📋 Copiar Código Completo</button>
            
            <div class="preview" id="preview">
                Ingresa los datos y haz clic en "Generar Código"
            </div>
        </div>
    </div>
    
    <script>
        // Datos por defecto de ataques
        let ataques = [
            {
                nombre: "Possession",
                gen: "https://i.imgur.com/7S29w5Q.png",
                attack: 721,
                upgrade: 1029,
                porcentaje: 30,
                porcentajeUpgrade: 40
            },
            {
                nombre: "Ectoburst",
                gen: "https://i.imgur.com/2YSPY07.png",
                attack: 561,
                upgrade: 721,
                porcentaje: 30,
                porcentajeUpgrade: 40,
                esMulti: true
            }
        ];
        
        function renderAttacks() {
            const container = document.getElementById('attacksContainer');
            container.innerHTML = '';
            
            ataques.forEach((ataque, index) => {
                const div = document.createElement('div');
                div.className = 'attack-section';
                div.innerHTML = `
                    <h4>Ataque #${index + 1}</h4>
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" value="${ataque.nombre}" onchange="ataques[${index}].nombre = this.value">
                    </div>
                    <div class="form-group">
                        <label>URL Imagen Gen</label>
                        <input type="text" value="${ataque.gen}" onchange="ataques[${index}].gen = this.value">
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>Attack</label>
                            <input type="number" value="${ataque.attack}" onchange="ataques[${index}].attack = parseInt(this.value)">
                        </div>
                        <div class="form-group">
                            <label>Upgrade</label>
                            <input type="number" value="${ataque.upgrade}" onchange="ataques[${index}].upgrade = parseInt(this.value)">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group">
                            <label>Porcentaje Habilidad</label>
                            <input type="number" value="${ataque.porcentaje}" onchange="ataques[${index}].porcentaje = parseInt(this.value)">
                        </div>
                        <div class="form-group">
                            <label>Porcentaje Upgrade</label>
                            <input type="number" value="${ataque.porcentajeUpgrade}" onchange="ataques[${index}].porcentajeUpgrade = parseInt(this.value)">
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="display: flex; align-items: center; cursor: pointer;">
                            <input type="checkbox" ${ataque.esMulti ? 'checked' : ''} onchange="ataques[${index}].esMulti = this.checked" style="width: auto; margin-right: 8px;">
                            <span>Es Ataque Multi (AoE)</span>
                        </label>
                    </div>
                    <button class="remove-attack-btn" onclick="eliminarAtaque(${index})">Eliminar Ataque</button>
                `;
                container.appendChild(div);
            });
        }
        
        function agregarAtaque() {
            ataques.push({
                nombre: "Nuevo Ataque",
                gen: "https://i.imgur.com/imagen.png",
                attack: 500,
                upgrade: 700,
                porcentaje: 25,
                porcentajeUpgrade: 35,
                esMulti: false
            });
            renderAttacks();
        }
        
        function eliminarAtaque(index) {
            ataques.splice(index, 1);
            renderAttacks();
        }
        
        function generarCodigo() {
            const nombre = document.getElementById('nombre').value;
            const descripcion = document.getElementById('descripcion').value;
            const imagenMutante = document.getElementById('imagenMutante').value;
            const imagenLarva = document.getElementById('imagenLarva').value;
            const imagenTipo = document.getElementById('imagenTipo').value;
            const geneImg1 = document.getElementById('geneImg1').value;
            const geneImg2 = document.getElementById('geneImg2').value;
            const vida = document.getElementById('vida').value;
            const velocidad = document.getElementById('velocidad').value;
            const bingo = document.getElementById('bingo').value;
            const habilidad = document.getElementById('habilidad').value;
            const coins = document.getElementById('coins').value;
            
            let tablasGenes = '';
            
            ataques.forEach((ataque, idx) => {
                const tipoAtaque = ataque.esMulti ? '(multi)' : '';
                tablasGenes += `
    <td style="vertical-align: top; width: 50%;">
      <div class="gene-section">
        <h4>
          <img alt="${ataque.nombre}" src="${ataque.gen}" />
          ${ataque.nombre}
        </h4>
        <ul>
          <li><strong>Attack${tipoAtaque ? ' ' + tipoAtaque : ''}:</strong> ${ataque.attack}</li>
          <li><strong>Upgrade${tipoAtaque ? ' ' + tipoAtaque : ''}:</strong> ${ataque.upgrade}</li>
        </ul>
        <div class="ability-row">
          <img alt="Habilidad ${ataque.nombre}" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/icons/ability_weaken.png" />
          <span><strong>Ability:</strong> -${ataque.porcentaje}%</span>
        </div>
        <div class="ability-row">
          <img alt="Habilidad Mejorada ${ataque.nombre}" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/icons/ability_weaken.png" />
          <span><strong>Upgrade:</strong> -${ataque.porcentajeUpgrade}%</span>
        </div>
      </div>
    </td>`;
                if ((idx + 1) % 2 === 0 || idx === ataques.length - 1) {
                    if (idx === ataques.length - 1 && (idx + 1) % 2 === 1) {
                        tablasGenes = `  <table class="stats-table">\n  <tbody><tr>\n${tablasGenes}\n    <td style="vertical-align: top; width: 50%;"></td>\n  </tr>\n</tbody></table>`;
                    } else if ((idx + 1) % 2 === 0) {
                        tablasGenes = tablasGenes.replace(
                            tablasGenes.slice(0, tablasGenes.lastIndexOf('</td>')),
                            tablasGenes.slice(0, tablasGenes.lastIndexOf('</td>')) + `  <table class="stats-table">\n  <tbody><tr>\n`
                        );
                        if (idx === ataques.length - 1) {
                            tablasGenes += '\n</tbody></table>';
                        }
                    }
                }
            });
            
            // Reconstruir las tablas de genes de forma más clara
            let tablasGenesHTML = '  <table class="stats-table">\n  <tbody><tr>\n';
            ataques.forEach((ataque, idx) => {
                const tipoAtaque = ataque.esMulti ? '(multi)' : '';
                tablasGenesHTML += `    <td style="vertical-align: top; width: 50%;">
      <div class="gene-section">
        <h4>
          <img alt="${ataque.nombre}" src="${ataque.gen}" />
          ${ataque.nombre}
        </h4>
        <ul>
          <li><strong>Attack${tipoAtaque ? ' ' + tipoAtaque : ''}:</strong> ${ataque.attack}</li>
          <li><strong>Upgrade${tipoAtaque ? ' ' + tipoAtaque : ''}:</strong> ${ataque.upgrade}</li>
        </ul>
        <div class="ability-row">
          <img alt="Habilidad ${ataque.nombre}" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/icons/ability_weaken.png" />
          <span><strong>Ability:</strong> -${ataque.porcentaje}%</span>
        </div>
        <div class="ability-row">
          <img alt="Habilidad Mejorada ${ataque.nombre}" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/icons/ability_weaken.png" />
          <span><strong>Upgrade:</strong> -${ataque.porcentajeUpgrade}%</span>
        </div>
      </div>
    </td>\n`;
                if ((idx + 1) % 2 === 0) {
                    tablasGenesHTML += '  </tr>\n</tbody></table>\n';
                    if (idx < ataques.length - 1) {
                        tablasGenesHTML += '  <table class="stats-table">\n  <tbody><tr>\n';
                    }
                }
            });
            
            if (ataques.length % 2 === 1) {
                tablasGenesHTML += '    <td style="vertical-align: top; width: 50%;"></td>\n  </tr>\n</tbody></table>\n';
            }
            
            const codigo = `<p>Detailed profile of the mutant ${nombre} — includes history, stats, gallery, and videos.</p>
<!--more-->

<!--Imagen miniatura para Blogger--> 
<img class="entry-thumbnail" src="https://i.imgur.com/qYtZXZL.jpeg" style="display: none;" />

<!--TARJETA DEL MUTANTE-->
<div class="mutant-card">

  <!--ENCABEZADO-->
  <div class="mutant-header">
<div class="mutant-image-container">
  <img alt="Name of the Mutant" class="mutant-image" src="${imagenMutante}" />
  <img alt="Larva" class="larva-image" src="${imagenLarva}" />
</div>

    <!--Info-->
    <div class="mutant-info">
      <h2>${nombre}</h2>

      <!--Genes-->
      <div class="genes-row">
        <img src="${geneImg1}" />
        <img src="${geneImg2}" />
      </div>

      <!--Detalles adicionales-->
      <div class="mutant-meta">
<div class="meta-item">
  <img alt="Bingo" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/main/morphology.png" />
  <span>Bingo: ${bingo}</span></div>
<div class="meta-item">
  <img alt="Speed" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/common_files/icon_speed.png" />
  <span>Speed: ${velocidad}</span>
</div>
<div class="meta-item">
  <img alt="Ability ${habilidad}" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/icons/ability_weaken.png" />
  <span>Ability: ${habilidad}</span>
</div>
<div class="meta-item">
  <img alt="Coins" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/common_files/icon_sc.png" />
  <span>Coins: ${coins} per hour</span>
</div>

      </div>
    </div>
    <img alt="Type" class="mutant-type-image" src="${imagenTipo}" />
  </div>

  <!--DESCRIPCIÓN-->
  <div class="mutant-section">
    <h3>Story</h3>
    <p>${descripcion}</p>
  </div>

<!--ESTADÍSTICAS Y HABILIDADES-->
<div class="mutant-section">
  <h3>📊 Stats</h3>

  <!--✅ Tabla de estadísticas básicas con nueva clase-->
  <table class="stats-table main-stats-table">
    <tbody>
      <tr>
        <td><img alt="Life" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/common_files/icon_hp.png" title="Life" /></td>
        <td><strong>Life</strong></td>
        <td>${vida}</td>
      </tr>
      <tr>
        <td><img alt="Speed" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/common_files/icon_speed.png" title="Speed" /></td>
        <td><strong>Speed</strong></td>
        <td>${velocidad}</td>
      </tr>
      <tr>
        <td><img alt="Bingo" src="https://s-ak.kobojo.com/mutants/assets/mobile/hud/main/morphology.png" title="Bingo" /></td>
        <td><strong>Bingo:</strong></td>
        <td>${bingo}</td>
      </tr>
    </tbody>
  </table>

<!--GENES EN DOS COLUMNAS-->
<!--GEN SABER--><!--GEN CIBERNÉTICO-->
${tablasGenesHTML}

    <!--How to get it-->
  <div class="mutant-section">
    <h3>How to get it?</h3>
    <h5>Store: Monthly Mutant</h5>
    <p>The mutant can only be obtained by Store. </p>
  </div>
  
      <!--Additional Information-->
  <div class="mutant-section">
    <h3>Extra Information</h3>
    <p>No needed.</p>
    <div class="version-icons">
      <img alt="Working..." src="test.png" />
    </div>
  </div>
  
  <!--Suggested ORBS-->
  <div class="mutant-section">
    <h3>Suggested equipment</h3>
    <p>These are suggested equipment created by the community.</p>
    <div class="version-icons">
      <img alt="Working..." src="test.png" />
    </div>
  </div>

  <!--VERSIONS-->
  <div class="mutant-section">
    <h3>Available versions</h3>
    <div class="version-icons">
      <img alt="Working..." src="Test.png" />
    </div>
  </div>

<!--STORE-->
<div class="mutant-section">
  <h3>🛒 Store</h3>
  <p>Not applicable.</p>
    <table class="stats-table store-table">
    <thead>
      <tr>
        <th>Offer name</th>
        <th>Amount</th>
        <th>Arrival date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>

      <tr>
        <td>Christmas Pack 3</td>
        <td>3500 Gold</td>
        <td>2025-01-03</td>
        <td>Pack three mutants (Store)</td>
      </tr>

    </tbody>
  </table>
</div>


<!--Carrusel Swiper-->
<div class="mutant-section mutant-gallery">
  <h3 style="text-align: center;">Gallery</h3>
  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img alt="Presentation" src="https://i.imgur.com/1M2ptxO.jpeg" /></div>
      <div class="swiper-slide"><img alt="Banner-NewMutant" src="https://i.imgur.com/qYtZXZL.jpeg" /></div>

    <!--Navegación-->
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
  </div>
</div>
  
  
  <!--Swiper JS-->
<script src="https://unpkg.com/swiper/swiper-bundle.min.js"><\/script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    new Swiper('.swiper', {
      loop: true,
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev'
      },
      pagination: {
        el: '.swiper-pagination',
        clickable: true
      }
    });
  });
<\/script>
  
  

  <!--VIDEOS-->
<div class="mutant-section mutant-videos">
  <h3>🎬 Videos</h3>
  <ul><div style="text-align: center;"><iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="" frameborder="0" height="315" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube.com/embed/A-lJvdR-jJQ?si=Z-26rx7QNLlvQVYd" title="YouTube video player" width="560"><\/iframe>
    
    </div>
  </ul>
</div>
</div>
  </div>
</div>`;
            
            document.getElementById('preview').textContent = codigo;
        }
        
        function copiarCodigo() {
            const preview = document.getElementById('preview');
            const text = preview.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const feedback = document.getElementById('copyFeedback');
                feedback.style.display = 'block';
                setTimeout(() => {
                    feedback.style.display = 'none';
                }, 3000);
            }).catch(() => {
                alert('Error al copiar el código');
            });
        }
        
        // Inicializar
        renderAttacks();
    </script>
</body>
</html>
