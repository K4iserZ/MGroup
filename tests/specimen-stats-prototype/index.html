<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specimen Stats Evolution Prototype</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07111f;
            --panel: #0f1b2d;
            --border: #2b4a6f;
            --text: #ecf0f1;
            --muted: #95a5a6;
            --accent: #3498db;
            --accent2: #e94560;
            --good: #2ecc71;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg), #0d1b2d);
            color: var(--text);
            min-height: 100vh;
        }
        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem 3rem;
        }
        h1 {
            margin-bottom: 0.3rem;
            color: #f39c12;
        }
        .intro {
            color: var(--muted);
            margin-bottom: 1.2rem;
        }
        .controls, .card {
            background: rgba(15, 27, 45, 0.95);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-weight: 600;
            color: #cfe8ff;
        }
        select, input {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.7rem;
            background: #101d31;
            color: var(--text);
        }
        #status {
            margin-bottom: 1rem;
            color: var(--good);
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0.7rem;
            margin-top: 1rem;
        }
        .stat-box {
            padding: 0.8rem;
            border: 1px solid rgba(52,152,219,0.25);
            border-radius: 8px;
            background: rgba(9,18,34,0.55);
        }
        .stat-label {
            color: var(--muted);
            font-size: 0.75rem;
            margin: 0 0 0.3rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .stat-value {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
        }
        .attack-list, .timeline-list {
            display: grid;
            gap: 0.55rem;
            margin-top: 0.75rem;
        }
        .attack-item, .timeline-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(52,152,219,0.22);
            background: rgba(9,18,34,0.4);
        }
        .attack-item.locked, .timeline-item.locked {
            opacity: 0.65;
        }
        .attack-item.unlocked, .timeline-item.unlocked {
            border-color: rgba(46,204,113,0.45);
            background: rgba(46,204,113,0.12);
        }
        .pill {
            padding: 0.25rem 0.55rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            background: rgba(52,152,219,0.16);
            color: #7ec0ee;
            white-space: nowrap;
        }
        .gene-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            vertical-align: middle;
        }
        .muted { color: var(--muted); }
        .small { font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Specimen Stats Evolution Prototype</h1>
        <p class="intro">
            Prototipo aislado para probar la evolución y desbloqueo de stats sin afectar la lógica principal. Aquí se elimina el piso de nivel 25 para poder validar la progresión desde el campo <strong>unlockAttack</strong>.
        </p>

        <div class="controls">
            <label>
                Specimen
                <input id="specimenInput" list="specimenList" placeholder="Escribe el mutant o el specimen" />
                <datalist id="specimenList"></datalist>
            </label>
            <label>
                Level
                <input id="levelInput" type="number" min="1" max="25" value="25" />
            </label>
            <label>
                Skin / Star
                <select id="skinSelect"></select>
            </label>
        </div>

        <div id="status">Loading data…</div>
        <div id="results"></div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
